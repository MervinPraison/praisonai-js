name: Sync to PraisonAI Monorepo

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch on MervinPraison/PraisonAI'
        required: false
        default: main
        type: string
      mode:
        description: 'pr = open pull request (default); commit = push directly to target branch'
        required: false
        default: pr
        type: choice
        options:
          - pr
          - commit
      upstream_issue:
        description: 'Optional PraisonAI hub issue (e.g. 1234) for traceability in sync PR'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      TARGET_REPO: MervinPraison/PraisonAI
      TARGET_PATH: src/praisonai-ts
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Validate token
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_TOKEN secret is required (PAT with repo write access to PraisonAI)."
            exit 1
          fi

      - name: Checkout praisonai-js
        uses: actions/checkout@v4

      - name: Checkout PraisonAI monorepo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.GH_TOKEN }}
          path: praisonai-monorepo
          ref: ${{ env.TARGET_BRANCH }}

      - name: Sync files into monorepo path
        run: |
          set -euo pipefail
          dest="praisonai-monorepo/${TARGET_PATH}"
          mkdir -p "$dest"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'coverage/' \
            --exclude '.DS_Store' \
            --exclude '*.tsbuildinfo' \
            ./ "$dest/"

      - name: Push changes
        working-directory: praisonai-monorepo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "$TARGET_PATH"; then
            echo "No changes to sync — praisonai-js already matches ${TARGET_PATH} on ${TARGET_BRANCH}."
            exit 0
          fi

          git add "$TARGET_PATH"
          msg="sync: update ${TARGET_PATH} from praisonai-js"

          if [ "${{ inputs.mode }}" = "commit" ]; then
            git commit -m "$msg"
            git push origin "HEAD:${TARGET_BRANCH}"
            echo "Committed and pushed directly to ${TARGET_BRANCH}."
            exit 0
          fi

          branch="sync/praisonai-js-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git commit -m "$msg"
          git push origin "$branch"

          gh pr create \
            --repo "$TARGET_REPO" \
            --base "$TARGET_BRANCH" \
            --head "$branch" \
            --title "$msg" \
            --body "$(cat <<EOF
Automated sync from [\`MervinPraison/praisonai-js\`](https://github.com/MervinPraison/praisonai-js) into \`${TARGET_PATH}\`.

Triggered manually via **Sync to PraisonAI Monorepo** workflow.
${{ inputs.upstream_issue != '' && format('Upstream hub issue: https://github.com/MervinPraison/PraisonAI/issues/{0}', inputs.upstream_issue) || '' }}

Excludes: \`.github/\`, \`node_modules/\`, \`dist/\`, \`coverage/\`.
EOF
)"
          echo "Opened PR on ${TARGET_REPO} (${branch} → ${TARGET_BRANCH})."
